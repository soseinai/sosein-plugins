<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Codex reads one composerIcon for both themes (no composerIconDark), so
     this file switches its own colours with the theme. -->
<style>
.on{fill:#111111}.off{stroke:#C9C9C3}
@media (prefers-color-scheme: dark){.on{fill:#F4F4F0}.off{stroke:#4A4A4E}}
</style>
<circle class="off" cx="50" cy="50" r="39.5" stroke-width="7"/>
<circle class="on" cx="50" cy="150" r="43"/>
<circle class="on" cx="50" cy="250" r="43"/>
<circle class="on" cx="150" cy="50" r="43"/>
<circle class="on" cx="150" cy="150" r="43"/>
<circle class="off" cx="150" cy="250" r="39.5" stroke-width="7"/>
<circle class="on" cx="250" cy="50" r="43"/>
<circle class="on" cx="250" cy="150" r="43"/>
<circle class="off" cx="250" cy="250" r="39.5" stroke-width="7"/>
</svg>
